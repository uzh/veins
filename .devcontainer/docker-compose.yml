services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # default user is "opam"
      - ..:/workspace:cached
      - build:/workspace/_build:cached
      - opam-5.5.2-2.6:/home/opam/.opam:cached
      - ${HOME}/.claude:/home/opam/.claude
      # Add database folders to dev container
      - db-mariadb:/databases/db-mariadb/:ro
      - db-postgres:/databases/db-postgres/:ro
    env_file: [.env]
    depends_on:
      - database-mariadb
      - database-postgres
    command: sleep infinity

  # NOTE: both servers run in Europe/Zurich on purpose: veins pins every session
  # to UTC, and a UTC server would let the tests for that pass trivially.
  database-mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command: --max_allowed_packet=629145600
    ports: [ "127.0.0.1:3344:3306" ]
    environment:
      TZ: Europe/Zurich
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: development
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db-mariadb:/var/lib/mysql
      - ./init-mariadb:/docker-entrypoint-initdb.d/:ro

  database-postgres:
    image: postgres:18
    restart: unless-stopped
    ports: [ "127.0.0.1:3345:5432" ]
    environment:
      TZ: Europe/Zurich
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
      POSTGRES_DB: development
    volumes:
      - db-postgres:/var/lib/postgresql
      - ./init-postgres:/docker-entrypoint-initdb.d/:ro

volumes:
  build:
  opam-5.5.2-2.6:
  db-mariadb:
  db-postgres:
