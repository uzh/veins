services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # default user is "opam"
      - ..:/workspace:cached
      - build:/workspace/_build:cached
      - opam-5.5.2-2.6:/home/opam/.opam:cached
      - ${HOME}/.claude:/home/opam/.claude
    env_file: [.env]
    environment:
      MARIADB_URL: mariadb://admin:password@database-mariadb/development
      MARIADB_READER_URL: mariadb://veins_reader:reader@database-mariadb/development
      MARIADB_WRITER_URL: mariadb://veins_writer:writer@database-mariadb/development
      MARIADB_MIGRATOR_URL: mariadb://veins_migrator:migrator@database-mariadb/development
      POSTGRES_URL: postgresql://root:root@database-postgres/development
      POSTGRES_READER_URL: postgresql://veins_reader:reader@database-postgres/development
      POSTGRES_WRITER_URL: postgresql://veins_writer:writer@database-postgres/development
      POSTGRES_MIGRATOR_URL: postgresql://veins_migrator:migrator@database-postgres/development
    depends_on:
      database-mariadb:
        condition: service_healthy
      database-postgres:
        condition: service_healthy
    command: sleep infinity

  database-mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command: --max_allowed_packet=629145600
    ports: [ 3344:3306 ]
    environment:
      TZ: Europe/Zurich
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: development
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db-mariadb:/var/lib/mysql
      - ./init-mariadb:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uadmin", "-ppassword" ]
      interval: 2s
      timeout: 5s
      retries: 60

  database-postgres:
    image: postgres:18
    restart: unless-stopped
    ports: [ 3345:5432 ]
    environment:
      TZ: Europe/Zurich
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
      POSTGRES_DB: development
    volumes:
      - db-postgres:/var/lib/postgresql
      - ./init-postgres:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-U", "root", "-d", "development" ]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  build:
  opam-5.5.2-2.6:
  db-mariadb:
  db-postgres:
